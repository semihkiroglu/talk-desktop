name: Windows Container MSI PoC

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/windows-container-msi-poc.yml
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: true
        default: v2.3.2
        type: string

permissions:
  contents: read

jobs:
  build-msi-in-windows-container:
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout upstream Talk Desktop
        uses: actions/checkout@v4
        with:
          repository: nextcloud/talk-desktop
          ref: ${{ inputs.ref || 'v2.3.2' }}
          fetch-depth: 0

      - name: Ensure Docker service is running
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $service = Get-Service docker -ErrorAction Stop
          if ($service.Status -ne 'Running') {
            Start-Service docker
          }
          docker version
          docker info

      - name: Build Talk Desktop MSI inside Windows container
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $workspace = $env:GITHUB_WORKSPACE
          Write-Host "Workspace: $workspace"

          docker pull mcr.microsoft.com/windows/servercore:ltsc2022

          $containerScript = @'
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          
          New-Item -ItemType Directory -Force C:\tools | Out-Null
          
          Invoke-WebRequest -Uri "https://nodejs.org/dist/v24.18.0/node-v24.18.0-x64.msi" -OutFile "C:\tools\node.msi"
          $nodeInstall = Start-Process "msiexec.exe" -ArgumentList "/i","C:\tools\node.msi","/qn","/norestart" -Wait -PassThru
          if ($nodeInstall.ExitCode -notin 0, 3010) {
            throw "Node.js install failed with exit code $($nodeInstall.ExitCode)"
          }
          $nodeDir = "C:\Program Files\nodejs"
          
          $gitRelease = Invoke-RestMethod -Headers @{ "User-Agent" = "talk-desktop-msi-poc" } -Uri "https://api.github.com/repos/git-for-windows/git/releases/latest"
          $gitAsset = $gitRelease.assets | Where-Object { $_.name -match "^MinGit-.*-64-bit\.zip$" } | Select-Object -First 1
          if (-not $gitAsset) {
            throw "Could not find a 64-bit MinGit release asset."
          }
          Invoke-WebRequest -Uri $gitAsset.browser_download_url -OutFile "C:\tools\mingit.zip"
          Expand-Archive "C:\tools\mingit.zip" -DestinationPath "C:\tools\git" -Force
          
          Invoke-WebRequest -Uri "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip" -OutFile "C:\tools\wix.zip"
          Expand-Archive "C:\tools\wix.zip" -DestinationPath "C:\tools\wix" -Force
          
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "C:\tools\vc_redist.x64.exe"
          $vc = Start-Process "C:\tools\vc_redist.x64.exe" -ArgumentList "/install","/quiet","/norestart" -Wait -PassThru
          if ($vc.ExitCode -notin 0, 1638, 3010) {
            throw "VC++ Redistributable install failed with exit code $($vc.ExitCode)"
          }
          
          $env:Path = "$nodeDir;C:\tools\git\cmd;C:\tools\wix;" + $env:Path
          
          node --version
          npm install --global "npm@^11.3.0"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --version
          git --version
          candle.exe -?
          
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
          
          Set-Location C:\work
          
          npm run release:package -- --windows --version=v25.0.0 --skip-check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          
          Write-Host "Generated MSI files:"
          Get-ChildItem C:\work\out -Recurse -Filter *.msi | Select-Object FullName, Length
          '@
          
                    $scriptPath = Join-Path $workspace ".container-build.ps1"
                    [System.IO.File]::WriteAllText($scriptPath, $containerScript, [System.Text.UTF8Encoding]::new($false))
          
                    docker run --rm --mount "type=bind,source=$workspace,target=C:\work" mcr.microsoft.com/windows/servercore:ltsc2022 powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File C:\work\.container-build.ps1

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: talk-desktop-windows-msi-${{ inputs.ref || 'v2.3.2' }}
          path: out/**/*.msi
          if-no-files-found: error
          retention-days: 7
